<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Health OS — обзорный canvas</title>
  <link rel="stylesheet" href="styles/tokens.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="screens/components.jsx"></script>
  <script type="text/babel" src="screens/data.jsx"></script>
  <script type="text/babel" src="screens/auth.jsx"></script>
  <script type="text/babel" src="screens/dashboard.jsx"></script>
  <script type="text/babel" src="screens/upload.jsx"></script>
  <script type="text/babel" src="screens/documents.jsx"></script>
  <script type="text/babel" src="screens/ocr-review.jsx"></script>
  <script type="text/babel" src="screens/analyses-table.jsx"></script>
  <script type="text/babel" src="screens/indicator.jsx"></script>
  <script type="text/babel" src="screens/ultrasound.jsx"></script>
  <script type="text/babel" src="screens/pregnancy.jsx"></script>
  <script type="text/babel" src="screens/ai-summary.jsx"></script>

  <script type="text/babel">
    const {
      DesignCanvas, DCSection, DCArtboard,
      AuthScreen, DashboardScreen, UploadScreen, OCRReviewScreen,
      DocumentsScreen, AnalysesTableScreen, IndicatorScreen, UltrasoundScreen,
      PregnancyScreen, AISummaryScreen,
    } = window;

    // standard desktop frame
    const DESK_W = 1440;
    const DESK_H = 900;
    const TALL_H = 1100; // for content-heavy screens

    function Wrap({ children, theme }) {
      return (
        <div className={theme === 'linen' ? 'theme-linen' : ''} style={{ width: '100%', height: '100%' }}>
          {children}
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          {/* ============== INTRO ============== */}
          <DCSection
            id="overview"
            title="Personal Health OS"
            subtitle="Персональная операционная система здоровья. 2 визуальных направления — Mist (Oura-like) и Linen (тёплая бумага). 10 ключевых экранов, готовых под клик."
          >
            <DCArtboard id="intro" label="система · обзор" width={1100} height={620}>
              <IntroBoard />
            </DCArtboard>
          </DCSection>

          {/* ============== DIRECTION A — MIST ============== */}
          <DCSection
            id="mist"
            title="Направление A · Mist"
            subtitle="Холодный off-white, акцент pale sage. Oura / Apple Health DNA. Все 8 экранов в одной системе."
          >
            <DCArtboard id="mist-auth" label="01 · Авторизация" width={DESK_W} height={DESK_H}>
              <Wrap theme="mist"><AuthScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-dashboard" label="02 · Dashboard · health command center" width={DESK_W} height={TALL_H}>
              <Wrap theme="mist"><DashboardScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-upload" label="03 · Загрузка документов" width={DESK_W} height={DESK_H}>
              <Wrap theme="mist"><UploadScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-documents" label="04 · Документы · storage/statuses" width={DESK_W} height={DESK_H}>
              <Wrap theme="mist"><DocumentsScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-ocr" label="05 · OCR review · core feature" width={DESK_W} height={DESK_H}>
              <Wrap theme="mist"><OCRReviewScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-table" label="06 · Таблица показателей" width={DESK_W} height={DESK_H}>
              <Wrap theme="mist"><AnalysesTableScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-indicator" label="07 · Страница показателя · Ферритин" width={DESK_W} height={TALL_H}>
              <Wrap theme="mist"><IndicatorScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-uz" label="08 · УЗИ · timeline" width={DESK_W} height={DESK_H}>
              <Wrap theme="mist"><UltrasoundScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-pregnancy" label="09 · Режим беременности" width={DESK_W} height={TALL_H}>
              <Wrap theme="mist"><PregnancyScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="mist-ai" label="10 · AI-сводка" width={DESK_W} height={TALL_H}>
              <Wrap theme="mist"><AISummaryScreen /></Wrap>
            </DCArtboard>
          </DCSection>

          {/* ============== DIRECTION B — LINEN ============== */}
          <DCSection
            id="linen"
            title="Направление B · Linen"
            subtitle="Тёплая бумажная база, глубокий sage. Ощущение премиум-документа, чуть «бумажнее». Ключевые экраны для сравнения."
          >
            <DCArtboard id="linen-dashboard" label="02 · Dashboard · Linen" width={DESK_W} height={TALL_H}>
              <Wrap theme="linen"><DashboardScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="linen-ocr" label="04 · OCR review · Linen" width={DESK_W} height={DESK_H}>
              <Wrap theme="linen"><OCRReviewScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="linen-documents" label="05 · Документы · Linen" width={DESK_W} height={DESK_H}>
              <Wrap theme="linen"><DocumentsScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="linen-indicator" label="06 · Показатель · Linen" width={DESK_W} height={TALL_H}>
              <Wrap theme="linen"><IndicatorScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="linen-pregnancy" label="09 · Беременность · Linen" width={DESK_W} height={TALL_H}>
              <Wrap theme="linen"><PregnancyScreen /></Wrap>
            </DCArtboard>

            <DCArtboard id="linen-ai" label="10 · AI-сводка · Linen" width={DESK_W} height={TALL_H}>
              <Wrap theme="linen"><AISummaryScreen /></Wrap>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    function IntroBoard() {
      return (
        <div className="phos-root" style={{
          width: '100%', height: '100%',
          background: 'var(--mist-bg)',
          padding: '56px 64px',
          display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 48,
          overflow: 'hidden',
        }}>
          <div style={{ display: 'flex', flexDirection: 'column' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 28 }}>
              <div style={{
                width: 32, height: 32, borderRadius: 10,
                background: 'var(--mist-text)', color: 'var(--mist-surface)',
                display: 'grid', placeItems: 'center', fontFamily: 'Geist Mono', fontWeight: 500, fontSize: 15,
              }}>h</div>
              <span style={{ fontSize: 17, fontWeight: 500 }}>health.os</span>
              <span className="badge badge-ghost" style={{ marginLeft: 10 }}>v0.1 · concept</span>
            </div>
            <div className="t-eyebrow" style={{ marginBottom: 14 }}>personal health operating system</div>
            <h1 style={{
              margin: 0, fontSize: 56, lineHeight: 1.05, fontWeight: 400,
              letterSpacing: '-0.035em', textWrap: 'balance',
            }}>
              Вся история здоровья —{' '}
              <span style={{ color: 'var(--mist-text-faint)' }}>в одном спокойном месте.</span>
            </h1>
            <p style={{
              marginTop: 22, fontSize: 16, lineHeight: 1.55, color: 'var(--mist-text-muted)',
              maxWidth: 540,
            }}>
              Загружайте PDF из любой лаборатории — система распознаёт показатели, строит динамику,
              хранит УЗИ и заключения. AI-ассистент помогает понять, что изменилось.
            </p>

            <div style={{ marginTop: 'auto', display: 'flex', gap: 32 }}>
              {[
                ['47', 'показателей в системе'],
                ['18', 'анализов в истории'],
                ['6', 'УЗИ-исследований'],
                ['0.4 с', 'обработка одного PDF'],
              ].map(([k, v]) => (
                <div key={v} style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  <span className="num" style={{ fontSize: 28, fontWeight: 400, letterSpacing: '-0.025em' }}>{k}</span>
                  <span style={{ fontSize: 12, color: 'var(--mist-text-faint)' }}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          {/* right: system summary */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <SystemCard title="палитра" >
              <Swatches />
            </SystemCard>
            <SystemCard title="типографика" >
              <TypeRow />
            </SystemCard>
            <SystemCard title="статусы" >
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                <span className="badge badge-mint"><span className="dot" />в норме</span>
                <span className="badge badge-amber"><span className="dot" />на границе</span>
                <span className="badge badge-coral"><span className="dot" />отклонение</span>
                <span className="badge badge-sky"><span className="dot" />обрабатывается</span>
                <span className="badge badge-ghost">черновик</span>
              </div>
            </SystemCard>
          </div>
        </div>
      );
    }

    function SystemCard({ title, children }) {
      return (
        <div className="surface" style={{ padding: '14px 16px' }}>
          <div className="t-eyebrow" style={{ marginBottom: 10 }}>{title}</div>
          {children}
        </div>
      );
    }

    function Swatches() {
      const items = [
        ['базовый фон', 'var(--mist-bg)', 'border'],
        ['поверхность', 'var(--mist-surface)', 'border'],
        ['surface-2', 'var(--mist-surface-2)', 'border'],
        ['текст', 'var(--mist-text)', ''],
        ['акцент', 'var(--mist-accent-strong)', ''],
        ['акцент soft', 'var(--mist-accent-soft)', 'border'],
      ];
      return (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
          {items.map(([lbl, c, b]) => (
            <div key={lbl} style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <div style={{
                height: 36, borderRadius: 8, background: c,
                border: b ? '1px solid var(--mist-border)' : 'none',
              }} />
              <span style={{ fontSize: 10.5, color: 'var(--mist-text-faint)' }}>{lbl}</span>
            </div>
          ))}
        </div>
      );
    }

    function TypeRow() {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
            <span style={{ fontSize: 28, letterSpacing: '-0.028em', fontWeight: 400 }}>Анна Соколова</span>
            <span style={{ fontSize: 11, color: 'var(--mist-text-faint)' }} className="mono">Geist 28/—</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
            <span style={{ fontSize: 14 }}>Показатели в норме</span>
            <span style={{ fontSize: 11, color: 'var(--mist-text-faint)' }} className="mono">Geist 14/regular</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
            <span className="num mono" style={{ fontSize: 18, fontWeight: 500 }}>124 г/л · 4.15 ×10¹²/л</span>
            <span style={{ fontSize: 11, color: 'var(--mist-text-faint)' }} className="mono">Geist Mono · tabular</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
